<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub Admin workspace — Property Moderation."
  >

  <title>Property Moderation | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/admin-dashboard.css"
  >
</head>

<body
  class="app-page"
  data-app-area="admin"
  data-admin-page="properties"
>
  <div class="app-shell">
    <aside
      class="app-shell__nav"
      id="app-navigation"
      data-app-navigation
    ></aside>

    <div class="app-shell__body">
      <header
        class="app-topbar"
        data-app-topbar
      ></header>

      <main
        class="app-main"
        id="main-content"
      >
        <div class="app-content">
          <header class="app-page-heading">
            <div class="flow-sm">
              <p class="text-eyebrow">
                LarHub Admin
              </p>

              <h1>
                Properties
              </h1>

              <p class="text-measure">
                Review property moderation state and simulate approval or rejection locally.
              </p>
            </div>
          </header>

          <section
            class="admin-access-note"
            data-admin-access-note
            hidden
          ></section>

          
          <section class="app-section">
            <div class="app-section__heading">
              <div>
                <p class="text-eyebrow">
                  Moderation
                </p>

                <h2>
                  Property review
                </h2>
              </div>
            </div>

            <div class="admin-toolbar">
              <label>
                <span class="text-label">
                  Moderation status
                </span>

                <select
                  data-admin-property-filter
                >
                  <option value="">
                    All properties
                  </option>

                  <option value="approved">
                    Approved
                  </option>

                  <option value="pending-review">
                    Pending Review
                  </option>

                  <option value="rejected">
                    Rejected
                  </option>
                </select>
              </label>
            </div>

            <p class="admin-demo-note text-small">
              Admin moderation changes are browser-local
              and do not mutate the static public property dataset.
            </p>

            <div
              class="admin-table-wrap"
              data-admin-properties
            ></div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div
    class="app-nav-backdrop"
    data-app-nav-backdrop
    hidden
  ></div>

  <script
    type="module"
    src="/js/pages/admin-dashboard.js"
  ></script>
</body>
</html>
