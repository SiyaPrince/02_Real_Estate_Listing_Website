<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub Agent workspace — My Listings."
  >

  <title>My Listings | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/agent-dashboard.css"
  >
</head>

<body
  class="app-page"
  data-app-area="agent"
  data-agent-page="listings"
>
  <div class="app-shell">
    <aside
      class="app-shell__nav"
      id="app-navigation"
      data-app-navigation
    ></aside>

    <div class="app-shell__body">
      <header
        class="app-topbar"
        data-app-topbar
      ></header>

      <main
        class="app-main"
        id="main-content"
      >
        <div class="app-content">
          <header class="app-page-heading">
            <div class="flow-sm">
              <p class="text-eyebrow">
                LarHub Agent
              </p>

              <h1>
                My Listings
              </h1>

              <p class="text-measure">
                Review listing lifecycle, edit property information, and manage Sold/Rented states.
              </p>
            </div>
          </header>

          <section
            class="agent-access-note"
            data-agent-access-note
            hidden
          ></section>

          
          <section class="app-section">
            <div class="app-section__heading">
              <div>
                <p class="text-eyebrow">
                  Inventory
                </p>

                <h2>
                  My listings
                </h2>
              </div>

              <a
                class="button"
                href="/agent/property-form.html"
              >
                Add Property
              </a>
            </div>

            <div class="agent-listing-toolbar">
              <label>
                <span class="text-label">
                  Filter status
                </span>

                <select
                  data-agent-listing-filter
                >
                  <option value="">
                    All statuses
                  </option>

                  <option value="published">
                    Published
                  </option>

                  <option value="under-offer">
                    Under Offer
                  </option>

                  <option value="draft">
                    Draft
                  </option>

                  <option value="sold">
                    Sold
                  </option>

                  <option value="rented">
                    Rented
                  </option>
                </select>
              </label>

              <button
                class="button button--tertiary"
                type="button"
                data-reset-agent-listings
              >
                Reset local listing changes
              </button>
            </div>

            <p class="agent-demo-note text-small">
              Sold and Rented are management-only states.
              Changes here are stored locally and do not
              alter the public marketplace demo dataset.
            </p>

            <div
              class="agent-listing-list"
              data-agent-listings
            ></div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div
    class="app-nav-backdrop"
    data-app-nav-backdrop
    hidden
  ></div>

  <script
    type="module"
    src="/js/pages/agent-dashboard.js"
  ></script>
</body>
</html>
