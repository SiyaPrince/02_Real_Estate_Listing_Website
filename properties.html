<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Search and filter LarHub property listings across South Africa."
  >

  <title>Properties | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/properties.css"
  >
</head>

<body class="page">
  <header data-public-header></header>

  <main id="main-content">
    <section
      class="properties-hero"
      aria-labelledby="properties-title"
    >
      <div class="container properties-hero__inner">
        <div class="flow-sm">
          <p class="text-eyebrow">
            Property marketplace
          </p>

          <h1 id="properties-title">
            Properties
          </h1>

          <p
            class="text-body-lg text-measure"
            data-properties-context
          >
            Explore available properties across South Africa.
          </p>
        </div>

        <form
          class="properties-search"
          data-properties-search
        >
          <div class="properties-search__field">
            <label
              class="text-label"
              for="properties-listing-type"
            >
              Looking to
            </label>

            <select
              id="properties-listing-type"
              name="listing"
            >
              <option value="">
                Buy or rent
              </option>

              <option value="sale">
                Buy
              </option>

              <option value="rent">
                Rent
              </option>
            </select>
          </div>

          <div class="properties-search__field">
            <label
              class="text-label"
              for="properties-location"
            >
              Location
            </label>

            <input
              id="properties-location"
              name="location"
              type="search"
              placeholder="City, suburb or province"
              autocomplete="address-level2"
            >
          </div>

          <div class="properties-search__field">
            <label
              class="text-label"
              for="properties-type"
            >
              Property type
            </label>

            <select
              id="properties-type"
              name="type"
            >
              <option value="">
                Any property type
              </option>

              <option value="house">
                House
              </option>

              <option value="apartment">
                Apartment
              </option>

              <option value="townhouse">
                Townhouse
              </option>

              <option value="commercial">
                Commercial
              </option>

              <option value="land">
                Land
              </option>
            </select>
          </div>

          <button
            class="button button--lg"
            type="submit"
          >
            Search
          </button>
        </form>
      </div>
    </section>

    <section
      class="section properties-results"
      aria-labelledby="results-title"
    >
      <div class="container">
        <div class="properties-toolbar">
          <div class="flow-sm">
            <h2
              class="properties-toolbar__title"
              id="results-title"
              data-results-title
            >
              Available properties
            </h2>

            <p
              class="text-small"
              aria-live="polite"
              data-result-count
            ></p>
          </div>

          <div class="properties-toolbar__controls">
            <button
              class="button button--secondary properties-filter-toggle"
              type="button"
              aria-controls="properties-filters"
              aria-expanded="false"
              data-filter-toggle
            >
              Filters
            </button>

            <div class="properties-sort">
              <label
                class="text-label"
                for="properties-sort"
              >
                Sort
              </label>

              <select
                id="properties-sort"
                data-sort-control
              >
                <option value="relevance">
                  Most relevant
                </option>

                <option value="price-asc">
                  Price: low to high
                </option>

                <option value="price-desc">
                  Price: high to low
                </option>

                <option value="newest">
                  Newest
                </option>
              </select>
            </div>
          </div>
        </div>

        <div
          class="active-filters"
          data-active-filters
          aria-label="Active property filters"
        ></div>

        <div class="properties-layout">
          <aside
            class="properties-filters"
            id="properties-filters"
            aria-label="Property filters"
            data-filter-panel
          >
            <div class="properties-filters__header">
              <div>
                <p class="text-eyebrow">
                  Refine results
                </p>

                <h2>
                  Filters
                </h2>
              </div>

              <button
                class="icon-button properties-filters__close"
                type="button"
                aria-label="Close filters"
                data-filter-close
              >
                <span aria-hidden="true">
                  ×
                </span>
              </button>
            </div>

            <form
              class="filter-form"
              data-filter-form
            >
              <fieldset class="filter-group">
                <legend>
                  Price
                </legend>

                <div class="filter-price-grid">
                  <div>
                    <label
                      class="text-small"
                      for="min-price"
                    >
                      Minimum
                    </label>

                    <input
                      id="min-price"
                      name="minPrice"
                      type="number"
                      min="0"
                      step="50000"
                      inputmode="numeric"
                      placeholder="No min"
                    >
                  </div>

                  <div>
                    <label
                      class="text-small"
                      for="max-price"
                    >
                      Maximum
                    </label>

                    <input
                      id="max-price"
                      name="maxPrice"
                      type="number"
                      min="0"
                      step="50000"
                      inputmode="numeric"
                      placeholder="No max"
                    >
                  </div>
                </div>
              </fieldset>

              <fieldset class="filter-group">
                <legend>
                  Bedrooms
                </legend>

                <select
                  name="bedrooms"
                  aria-label="Minimum bedrooms"
                >
                  <option value="">
                    Any bedrooms
                  </option>

                  <option value="1">
                    1+ bedroom
                  </option>

                  <option value="2">
                    2+ bedrooms
                  </option>

                  <option value="3">
                    3+ bedrooms
                  </option>

                  <option value="4">
                    4+ bedrooms
                  </option>
                </select>
              </fieldset>

              <fieldset class="filter-group">
                <legend>
                  Bathrooms
                </legend>

                <select
                  name="bathrooms"
                  aria-label="Minimum bathrooms"
                >
                  <option value="">
                    Any bathrooms
                  </option>

                  <option value="1">
                    1+ bathroom
                  </option>

                  <option value="2">
                    2+ bathrooms
                  </option>

                  <option value="3">
                    3+ bathrooms
                  </option>
                </select>
              </fieldset>

              <fieldset class="filter-group">
                <legend>
                  Features
                </legend>

                <div class="filter-checks">
                  <label>
                    <input
                      type="checkbox"
                      name="features"
                      value="Garden"
                    >
                    Garden
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      name="features"
                      value="Security"
                    >
                    Security
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      name="features"
                      value="Solar"
                    >
                    Solar
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      name="features"
                      value="Fibre"
                    >
                    Fibre
                  </label>
                </div>
              </fieldset>

              <div class="filter-form__actions">
                <button
                  class="button"
                  type="submit"
                >
                  Apply Filters
                </button>

                <button
                  class="button button--tertiary"
                  type="button"
                  data-clear-filters
                >
                  Clear filters
                </button>
              </div>
            </form>
          </aside>

          <div
            class="properties-filter-backdrop"
            data-filter-backdrop
            hidden
          ></div>

          <div class="properties-content">
            <div
              class="properties-grid"
              data-property-grid
            ></div>

            <div
              class="empty-state"
              data-empty-state
              hidden
            >
              <p class="text-eyebrow">
                No results
              </p>

              <h3>
                No properties match your filters.
              </h3>

              <p class="text-measure-narrow">
                Try adjusting your search or clearing
                some filters.
              </p>

              <button
                class="button button--secondary"
                type="button"
                data-empty-clear
              >
                Clear Filters
              </button>
            </div>

            <div
              class="pagination"
              data-pagination
              aria-label="Property result pages"
            ></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer data-public-footer></footer>

  <script
    type="module"
    src="/js/main.js"
  ></script>

  <script
    type="module"
    src="/js/pages/properties.js"
  ></script>
</body>
</html>
