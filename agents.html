<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Discover LarHub property professionals and browse their active listings."
  >

  <title>Agents | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/agents.css"
  >
</head>

<body class="page">
  <header data-public-header></header>

  <main id="main-content">
    <section
      class="agents-hero"
      aria-labelledby="agents-title"
    >
      <div class="container agents-hero__inner">
        <div class="flow-sm">
          <p class="text-eyebrow">
            Property professionals
          </p>

          <h1 id="agents-title">
            Find an agent
          </h1>

          <p class="text-body-lg text-measure">
            Discover property professionals by name,
            area, or agency and explore their active
            LarHub listings.
          </p>
        </div>

        <form
          class="agents-search"
          data-agent-search
        >
          <label
            class="text-label"
            for="agent-search-query"
          >
            Search agents
          </label>

          <div class="agents-search__row">
            <input
              id="agent-search-query"
              name="q"
              type="search"
              placeholder="Agent, area or agency"
              autocomplete="off"
            >

            <button
              class="button"
              type="submit"
            >
              Search
            </button>
          </div>
        </form>
      </div>
    </section>

    <section
      class="section"
      aria-labelledby="agent-results-title"
    >
      <div class="container">
        <div class="agents-toolbar">
          <div class="flow-sm">
            <h2 id="agent-results-title">
              Property agents
            </h2>

            <p
              class="text-small"
              data-agent-result-count
              aria-live="polite"
            ></p>
          </div>

          <button
            class="button button--tertiary"
            type="button"
            data-clear-agent-search
            hidden
          >
            Clear search
          </button>
        </div>

        <div
          class="agents-grid"
          data-agent-grid
        ></div>

        <div
          class="empty-state"
          data-agent-empty
          hidden
        >
          <p class="text-eyebrow">
            No results
          </p>

          <h3>
            No agents match your search.
          </h3>

          <p>
            Try searching by a different name,
            area, or agency.
          </p>

          <button
            class="button button--secondary"
            type="button"
            data-agent-empty-clear
          >
            Clear Search
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer data-public-footer></footer>

  <script
    type="module"
    src="/js/main.js"
  ></script>

  <script
    type="module"
    src="/js/pages/agents.js"
  ></script>
</body>
</html>
