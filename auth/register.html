<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub authentication interface."
  >

  <title>Create Account | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/auth.css"
  >
</head>

<body class="auth-page">
  <main
    class="auth-layout"
    id="main-content"
  >
    <section class="auth-panel">
      <div class="auth-panel__inner">
        <a
          class="site-brand auth-brand"
          href="/index.html"
          aria-label="LarHub home"
        >
          LarHub
        </a>

        <div class="auth-heading">
          <p class="text-eyebrow">
            New to LarHub
          </p>

          <h1>
            Create an account
          </h1>

          <p>
            This interface represents the intended
            registration experience. Account creation
            is not connected yet.
          </p>
        </div>


        <div
          class="auth-providers"
          aria-label="Social sign in options"
        >
          <button
            class="auth-provider"
            type="button"
            data-auth-provider="Google"
          >
            <span
              class="auth-provider__mark"
              aria-hidden="true"
            >
              G
            </span>

            <span>
              Continue with Google
            </span>
          </button>

          <button
            class="auth-provider"
            type="button"
            data-auth-provider="Facebook"
          >
            <span
              class="auth-provider__mark"
              aria-hidden="true"
            >
              f
            </span>

            <span>
              Continue with Facebook
            </span>
          </button>

          <button
            class="auth-provider"
            type="button"
            data-auth-provider="Apple"
          >
            <span
              class="auth-provider__mark"
              aria-hidden="true"
            >
              A
            </span>

            <span>
              Continue with Apple
            </span>
          </button>
        </div>


        <div class="auth-divider">
          <span>
            or register with email
          </span>
        </div>

        <form
          class="auth-form"
          data-register-form
          novalidate
        >
          <label>
            <span class="text-label">
              Full name
            </span>

            <input
              name="name"
              type="text"
              autocomplete="name"
              required
            >

            <span
              class="form-error text-small"
              data-error-for="name"
            ></span>
          </label>

          <label>
            <span class="text-label">
              Email
            </span>

            <input
              name="email"
              type="email"
              autocomplete="email"
              required
            >

            <span
              class="form-error text-small"
              data-error-for="email"
            ></span>
          </label>

          <label>
            <span class="text-label">
              Password
            </span>

            <div class="auth-password-field">
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
                data-password-strength-input
              >

              <button
                class="auth-password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
              >
                Show
              </button>
            </div>

            <div
              class="password-strength"
              data-password-strength
              aria-live="polite"
            >
              Use at least 8 characters.
            </div>

            <span
              class="form-error text-small"
              data-error-for="password"
            ></span>
          </label>

          <label>
            <span class="text-label">
              Confirm password
            </span>

            <div class="auth-password-field">
              <input
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="auth-password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
              >
                Show
              </button>
            </div>

            <span
              class="form-error text-small"
              data-error-for="confirmPassword"
            ></span>
          </label>

          <label class="auth-checkbox">
            <input
              name="terms"
              type="checkbox"
              required
            >

            <span class="text-small">
              I understand this is a frontend demonstration
              and no real LarHub account will be created.
            </span>
          </label>

          <button
            class="button button--lg button--full"
            type="submit"
          >
            Create Account
          </button>

          <div
            class="auth-status"
            data-auth-status
            aria-live="polite"
          ></div>
        </form>

        <p class="auth-switch text-small">
          Already have an account?
          <a
            class="text-link"
            href="/auth/login.html"
          >
            Sign in
          </a>
        </p>

      </div>
    </section>

    <aside class="auth-visual">
      <img
        class="auth-visual__image"
        src="/assets/images/auth/auth-property-placeholder.svg"
        alt="Architectural LarHub property placeholder"
      >

      <div class="auth-visual__overlay">
        <p class="text-eyebrow">
          LarHub
        </p>

        <p class="auth-visual__quote">
          Property discovery built around clarity.
        </p>
      </div>
    </aside>
  </main>

  <script
    type="module"
    src="/js/pages/auth.js"
  ></script>
</body>
</html>
