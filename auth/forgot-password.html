<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub authentication interface."
  >

  <title>Reset Password | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/auth.css"
  >
</head>

<body class="auth-page">
  <main
    class="auth-layout"
    id="main-content"
  >
    <section class="auth-panel">
      <div class="auth-panel__inner">
        <a
          class="site-brand auth-brand"
          href="/index.html"
          aria-label="LarHub home"
        >
          LarHub
        </a>

        <div class="auth-heading">
          <p class="text-eyebrow">
            Password help
          </p>

          <h1>
            Reset your password
          </h1>

          <p>
            Enter your email address. The frontend
            will validate the form, but no reset email
            can be sent until a backend is connected.
          </p>
        </div>

        <form
          class="auth-form"
          data-forgot-form
          novalidate
        >
          <label>
            <span class="text-label">
              Email
            </span>

            <input
              name="email"
              type="email"
              autocomplete="email"
              required
            >

            <span
              class="form-error text-small"
              data-error-for="email"
            ></span>
          </label>

          <button
            class="button button--lg button--full"
            type="submit"
          >
            Request Reset
          </button>

          <div
            class="auth-status"
            data-auth-status
            aria-live="polite"
          ></div>
        </form>

        <p class="auth-switch text-small">
          Remembered your password?
          <a
            class="text-link"
            href="/auth/login.html"
          >
            Back to sign in
          </a>
        </p>

      </div>
    </section>

    <aside class="auth-visual">
      <img
        class="auth-visual__image"
        src="/assets/images/auth/auth-property.jpg"
        alt="Architectural LarHub property placeholder"
      >

      <div class="auth-visual__overlay">
        <p class="text-eyebrow">
          LarHub
        </p>

        <p class="auth-visual__quote">
          Property discovery built around clarity.
        </p>
      </div>
    </aside>
  </main>

  <script
    type="module"
    src="/js/pages/auth.js"
  ></script>
</body>
</html>
