<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub user workspace — Saved Properties."
  >

  <title>Saved Properties | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/user.css"
  >
</head>

<body
  class="app-page"
  data-app-area="user"
  data-user-page="saved"
>
  <div class="app-shell">
    <aside
      class="app-shell__nav"
      id="app-navigation"
      data-app-navigation
    ></aside>

    <div class="app-shell__body">
      <header
        class="app-topbar"
        data-app-topbar
      ></header>

      <main
        class="app-main"
        id="main-content"
      >
        <div class="app-content">
          <header class="app-page-heading">
            <div class="flow-sm">
              <p class="text-eyebrow">
                LarHub User
              </p>

              <h1>
                Saved Properties
              </h1>

              <p class="text-measure">
                Revisit properties you have shortlisted in this browser.
              </p>
            </div>
          </header>

          
          <section
            class="user-access-note"
            data-user-access-note
            hidden
          ></section>

          <section class="app-section">
            <div class="app-section__heading">
              <div>
                <p class="text-eyebrow">
                  Your shortlist
                </p>

                <h2>
                  Saved properties
                </h2>
              </div>

              <a
                class="button button--secondary"
                href="/properties.html"
              >
                Find more properties
              </a>
            </div>

            <div
              class="user-property-grid"
              data-user-saved-grid
            ></div>

            <div
              class="empty-state"
              data-user-saved-empty
              hidden
            >
              <h3>
                No saved properties yet
              </h3>

              <p>
                Save properties from cards or Property Details
                and they will appear here.
              </p>

              <a
                class="button button--secondary"
                href="/properties.html"
              >
                Browse Properties
              </a>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div
    class="app-nav-backdrop"
    data-app-nav-backdrop
    hidden
  ></div>

  <script
    type="module"
    src="/js/pages/user-dashboard.js"
  ></script>
</body>
</html>
