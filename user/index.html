<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LarHub user workspace — User Overview."
  >

  <title>User Overview | LarHub</title>

  <link
    rel="stylesheet"
    href="/css/main.css"
  >

  <link
    rel="stylesheet"
    href="/css/pages/user.css"
  >
</head>

<body
  class="app-page"
  data-app-area="user"
  data-user-page="overview"
>
  <div class="app-shell">
    <aside
      class="app-shell__nav"
      id="app-navigation"
      data-app-navigation
    ></aside>

    <div class="app-shell__body">
      <header
        class="app-topbar"
        data-app-topbar
      ></header>

      <main
        class="app-main"
        id="main-content"
      >
        <div class="app-content">
          <header class="app-page-heading">
            <div class="flow-sm">
              <p class="text-eyebrow">
                LarHub User
              </p>

              <h1>
                Overview
              </h1>

              <p class="text-measure">
                A local frontend view of your LarHub property activity.
              </p>
            </div>
          </header>

          
          <section
            class="user-access-note"
            data-user-access-note
            hidden
          ></section>

          <section
            class="dashboard-stats"
            aria-label="User activity summary"
          >
            <article class="dashboard-stat">
              <p class="text-small">
                Saved properties
              </p>

              <p
                class="dashboard-stat__value text-tabular"
                data-user-saved-count
              >
                0
              </p>

              <a
                class="text-link text-small"
                href="/user/saved.html"
              >
                View saved
              </a>
            </article>

            <article class="dashboard-stat">
              <p class="text-small">
                Recent properties
              </p>

              <p
                class="dashboard-stat__value text-tabular"
                data-user-recent-count
              >
                0
              </p>

              <a
                class="text-link text-small"
                href="/user/recently-viewed.html"
              >
                View history
              </a>
            </article>

            <article class="dashboard-stat">
              <p class="text-small">
                Demo enquiries
              </p>

              <p
                class="dashboard-stat__value text-tabular"
                data-user-enquiry-count
              >
                0
              </p>

              <a
                class="text-link text-small"
                href="/user/enquiries.html"
              >
                View enquiries
              </a>
            </article>
          </section>

          <section
            class="app-section"
            aria-labelledby="user-recent-preview-title"
          >
            <div class="app-section__heading">
              <div>
                <p class="text-eyebrow">
                  Continue browsing
                </p>

                <h2 id="user-recent-preview-title">
                  Recently viewed
                </h2>
              </div>

              <a
                class="text-link"
                href="/user/recently-viewed.html"
              >
                View all
              </a>
            </div>

            <div
              class="user-property-grid"
              data-user-recent-preview
            ></div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <div
    class="app-nav-backdrop"
    data-app-nav-backdrop
    hidden
  ></div>

  <script
    type="module"
    src="/js/pages/user-dashboard.js"
  ></script>
</body>
</html>
